name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      # The test suite shells out to real `git` (repo fixtures, `git http-backend`
      # smart-HTTP servers, `git cat-file` cross-checks against the compiled
      # module's own output). Installing the real git-crypt CLI flips
      # tests/gitcrypt.test.ts's hasGitCrypt()-gated cross-compatibility suite
      # from skipped to actually running, in both directions.
      - name: Install git and git-crypt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git git-crypt
          git --version
          git-crypt --version

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test
