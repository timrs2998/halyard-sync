name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref makes the in-flight run obsolete. Cancelling it
# frees the runner immediately instead of queueing behind work nobody wants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      # Only git-crypt: `git` itself is preinstalled on ubuntu-latest, and the
      # test suite's real git usage (repo fixtures, `git http-backend`
      # smart-HTTP servers, `git cat-file` cross-checks) works with it as
      # shipped. Installing git-crypt is what flips tests/gitcrypt.test.ts's
      # hasGitCrypt()-gated cross-compatibility suite from skipped to actually
      # running, in both directions.
      #
      # The runner image ships third-party apt sources (Microsoft, Docker,
      # GitHub CLI, ...) alongside Ubuntu's own. `apt-get update` refreshes all
      # of them, and one slow or unreachable host drags a normally
      # ~10-second step into the multi-minute range. git-crypt lives in
      # Ubuntu's universe, so drop everything else first. `ubuntu.sources` is
      # kept by name because 24.04 images put Ubuntu's own repos there.
      - name: Install git-crypt
        timeout-minutes: 3
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          sudo apt-get update -qq -o Acquire::Languages=none
          sudo apt-get install -y -qq --no-install-recommends git-crypt
          git --version
          git-crypt --version

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - name: Cache Obsidian downloads
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('wdio.conf.mts') }}
          restore-keys: |
            obsidian-cache-${{ runner.os }}-

      # Obsidian needs a virtual display and a window manager on Linux. Keep
      # both processes in this step so they stay alive for the test run.
      - name: Run E2E tests
        env:
          DISPLAY: ":99"
          OBSIDIAN_VERSIONS: "latest/latest"
          WDIO_MAX_INSTANCES: "2"
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*.list
          sudo apt-get update -q
          sudo apt-get install -q -y --no-install-recommends herbstluftwm dzen2 x11-xserver-utils xvfb

          Xvfb "$DISPLAY" -screen 0 1280x1024x24 +extension GLX -noreset &
          xvfb_pid=$!
          herbstluftwm &
          wm_pid=$!

          cleanup() {
            kill "$wm_pid" "$xvfb_pid" 2>/dev/null || true
            wait "$wm_pid" "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 1
          npm run test:e2e
