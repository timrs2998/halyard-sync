name: Release Obsidian plugin

on:
  push:
    # No "v" prefix: Obsidian's release validation requires the release tag
    # to match manifest.json's "version" field exactly (e.g. "1.0.0", not
    # "v1.0.0"). Tag with `git tag 1.0.0 && git push origin 1.0.0`.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Artifact attestations: `id-token` signs the provenance statement with
      # this run's OIDC identity, `attestations` writes it to the repo's
      # attestation store. Together they let anyone verify a released main.js
      # was built by this workflow, from this repository, with
      # `gh attestation verify main.js --repo <owner>/<repo>`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - name: Verify tag matches manifest.json version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest_version" ]; then
            echo "Tag '$tag' does not match manifest.json version '$manifest_version'"
            exit 1
          fi

      # Runs after the build, before the release: the attestation is derived
      # from the built bytes and does not modify them, so the reproducible
      # build the plugin portal verifies is unaffected.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "main.js,styles.css,manifest.json"

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            manifest.json main.js styles.css
