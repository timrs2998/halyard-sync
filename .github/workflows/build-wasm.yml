name: Rebuild libgit2 WASM

# The compiled module is committed, so this does not run on every push. It runs
# when the inputs that actually determine the output change — and on demand —
# and fails if the committed artifact no longer matches what those inputs
# produce. A cold build takes 10-15 minutes; see src/git/libgit2/build/BUILD.md.
on:
  workflow_dispatch:
  push:
    paths:
      - "src/git/libgit2/native/**"
      - "src/git/libgit2/build/build.sh"
      - "src/git/libgit2/build/versions.env"
      - ".github/workflows/build-wasm.yml"
  pull_request:
    paths:
      - "src/git/libgit2/native/**"
      - "src/git/libgit2/build/build.sh"
      - "src/git/libgit2/build/versions.env"

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    # Same pinned toolchain the committed artifact was produced with; see
    # src/git/libgit2/build/versions.env. GitHub-hosted runners run job
    # containers natively, so no Docker-in-Docker is involved.
    container: emscripten/emsdk:6.0.3
    steps:
      - uses: actions/checkout@v4

      # emsdk's image ships emcc/clang/node, but libgit2 configures through
      # CMake before emmake (which wraps make, not cmake) takes over.
      - name: Install cmake and build-essential
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake build-essential

      # The dominant cost is the emsdk toolchain download and the libgit2
      # clone, both of which live in .build-work. Key on the exact inputs that
      # force a real rebuild.
      - name: Cache build work tree
        uses: actions/cache@v4
        with:
          path: src/git/libgit2/build/.build-work
          key: libgit2-buildwork-${{ hashFiles('src/git/libgit2/build/versions.env', 'src/git/libgit2/build/build.sh', 'src/git/libgit2/native/*.c') }}
          restore-keys: |
            libgit2-buildwork-

      - name: Build
        working-directory: src/git/libgit2
        run: bash build/build.sh

      - name: Verify the committed artifact matches this build
        run: |
          if ! git diff --quiet -- src/git/libgit2/build/dist/; then
            echo "The committed build/dist artifacts differ from this build."
            echo "Rebuild locally (see src/git/libgit2/build/BUILD.md) and commit the result."
            git diff --stat -- src/git/libgit2/build/dist/
            exit 1
          fi
          echo "Committed artifacts match."

      - uses: actions/upload-artifact@v4
        with:
          name: tether-libgit2
          path: |
            src/git/libgit2/build/dist/tether-libgit2.js
            src/git/libgit2/build/dist/tether-libgit2.wasm
