name: Rebuild libgit2 WASM

# The compiled module is committed, so this does not run on every push. It runs
# when the inputs that determine the output change, and on demand.
#
# What it verifies is that the build recipe still works and still produces a
# WORKING module: it rebuilds from source, then runs the full test suite against
# the freshly built artifact. It deliberately does not require the rebuilt bytes
# to match the committed ones — the Emscripten build is not known to be
# bit-reproducible, so a byte comparison would fail for reasons unrelated to
# correctness. Drift is reported for a human to look at, not treated as failure.
#
# A cold build takes 10-15 minutes; see src/git/libgit2/build/BUILD.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "src/git/libgit2/native/**"
      - "src/git/libgit2/build/build.sh"
      - "src/git/libgit2/build/versions.env"
  pull_request:
    paths:
      - "src/git/libgit2/native/**"
      - "src/git/libgit2/build/build.sh"
      - "src/git/libgit2/build/versions.env"

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    # The pinned toolchain the committed artifact was produced with; see
    # src/git/libgit2/build/versions.env. GitHub-hosted runners run job
    # containers natively, so no Docker-in-Docker is involved.
    container: emscripten/emsdk:6.0.3
    steps:
      # Before checkout: actions/checkout silently falls back to downloading a
      # tarball (leaving no .git directory) when the container has no usable
      # git. emsdk's image ships emcc/clang/node but libgit2 still configures
      # through CMake, and git-crypt unskips the real cross-compatibility suite
      # in tests/gitcrypt.test.ts.
      - name: Install build and test dependencies
        timeout-minutes: 5
        run: |
          apt-get update -qq -o Acquire::Languages=none
          apt-get install -y -qq --no-install-recommends cmake build-essential git git-crypt

      - uses: actions/checkout@v4

      # The dominant cost is the emsdk toolchain download and the libgit2 clone,
      # both of which live in .build-work.
      - name: Cache build work tree
        uses: actions/cache@v4
        with:
          path: src/git/libgit2/build/.build-work
          key: libgit2-buildwork-${{ hashFiles('src/git/libgit2/build/versions.env', 'src/git/libgit2/build/build.sh', 'src/git/libgit2/native/*.c') }}
          restore-keys: |
            libgit2-buildwork-

      - name: Record the committed artifact's checksums
        run: |
          sha256sum src/git/libgit2/build/dist/halyard-libgit2.js                     src/git/libgit2/build/dist/halyard-libgit2.wasm             | tee "$RUNNER_TEMP/committed.sha256"

      - name: Build
        working-directory: src/git/libgit2
        run: bash build/build.sh

      # The real check: does the freshly built module actually work? This runs
      # against the rebuilt dist/, not the committed one, so a broken recipe
      # fails here even when the committed artifact is fine.
      - run: npm ci

      - run: npm test

      # Compared by checksum rather than `git diff`, so this works no matter how
      # the workspace was populated. Informational only: it must never fail the
      # job, hence the explicit `|| true` on the mismatch branch.
      - name: Report drift from the committed artifact
        run: |
          if sha256sum --check --status "$RUNNER_TEMP/committed.sha256"; then
            echo "Rebuilt artifact is byte-identical to the committed one."
          else
            echo "::notice::The rebuilt artifact differs from the committed one."
            echo "The test suite passed against the rebuild, so this is not a failure."
            echo "If native/*.c changed, commit the rebuilt files (see BUILD.md)."
            echo "--- committed ---"
            cat "$RUNNER_TEMP/committed.sha256"
            echo "--- rebuilt ---"
            sha256sum src/git/libgit2/build/dist/halyard-libgit2.js                       src/git/libgit2/build/dist/halyard-libgit2.wasm || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: halyard-libgit2
          path: |
            src/git/libgit2/build/dist/halyard-libgit2.js
            src/git/libgit2/build/dist/halyard-libgit2.node.js
            src/git/libgit2/build/dist/halyard-libgit2.wasm
